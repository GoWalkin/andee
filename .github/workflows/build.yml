# Builds the debug APK on every push and PR.
#
# Debug, not release: the release build type has no `signingConfig` and there is
# no keystore in this repository, so `assembleRelease` would emit an unsigned APK
# that cannot be installed. Signing needs secrets, and a workflow that fails on a
# fork for want of secrets the forker cannot add is worse than no workflow.
#
# The JDK is pinned to **17** on purpose and the range is narrow: AGP 8.3.1 needs
# 17 or newer, and the Gradle 8.4 wrapper cannot run on 21 or newer (it rejects
# the class file version). Bumping this without bumping Gradle breaks the build
# with an error that does not mention Java.
name: build

on:
  push:
    # GoWalkin fork: feature branches build too, so every push yields an
    # installable debug APK artifact without opening a PR first.
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - run: ./gradlew --no-daemon :app:assembleDebug

      # The real unit tests live in core/ (brain guards, friends, the GoWalkin
      # action guard and app aliases). Upstream CI never ran them.
      - run: ./gradlew --no-daemon :core:test

      # Host-side tests are template-only today, so this is a tripwire for the
      # day someone writes a real one rather than a meaningful gate now.
      - run: ./gradlew --no-daemon :app:testDebugUnitTest

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          # One APK per ABI, so the glob replaces what used to be a single
          # `app-debug.apk`: ML Kit's barhopper .so is ~4 MB and the fat APK
          # carried four copies of it. See the `splits` block in app/build.gradle.
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # assembleRelease is its own job rather than a step above, because it is a
  # *gate* and not a deliverable: the APK has no signingConfig and cannot be
  # installed. What it catches is what went unnoticed until now — R8 and
  # `lintVitalRelease` only run on release, so a missing keep rule, or a
  # resource the lint check cannot parse, is invisible until someone tries to
  # ship. That is exactly how a failing `assembleRelease` sat in this repo.
  # Runs in parallel, so it costs a PR no wall-clock time.
  #
  # GoWalkin fork: when the repository has the four ANDEE_* secrets, the same
  # job signs the release build and uploads it — smaller, faster and not
  # debuggable, unlike the debug APK. Without them (forks, PRs from forks) it is
  # the unsigned gate it always was. Secrets cannot appear in `if:`, so they are
  # mapped into env first and the steps test env.
  release-gate:
    runs-on: ubuntu-latest
    env:
      ANDEE_KEYSTORE_B64: ${{ secrets.ANDEE_KEYSTORE_B64 }}
      ANDEE_STORE_PASS: ${{ secrets.ANDEE_STORE_PASS }}
      ANDEE_KEY_ALIAS: ${{ secrets.ANDEE_KEY_ALIAS }}
      ANDEE_KEY_PASS: ${{ secrets.ANDEE_KEY_PASS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - name: Decode the release keystore
        if: env.ANDEE_KEYSTORE_B64 != ''
        run: |
          echo "$ANDEE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/andee-release.jks"
          echo "ANDEE_KEYSTORE_FILE=$RUNNER_TEMP/andee-release.jks" >> "$GITHUB_ENV"

      - run: ./gradlew --no-daemon :app:assembleRelease

      - uses: actions/upload-artifact@v4
        if: env.ANDEE_KEYSTORE_B64 != ''
        with:
          name: app-release-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
